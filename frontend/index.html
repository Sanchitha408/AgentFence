<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AgentFence — Security Dashboard</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#/overview">
          <span class="brand-mark" aria-hidden="true">AF</span>
          <span>
            <strong>AgentFence</strong>
            <small>Security validation</small>
          </span>
        </a>

        <nav class="nav" aria-label="Dashboard pages">
          <a class="nav-link" href="#/overview" data-route="overview">
            <span class="nav-dot"></span>Overview
          </a>
          <a class="nav-link" href="#/results" data-route="results">
            <span class="nav-dot"></span>Results
          </a>
          <a class="nav-link" href="#/policies" data-route="policies">
            <span class="nav-dot"></span>Policies
          </a>
          <a class="nav-link" href="#/audit" data-route="audit">
            <span class="nav-dot"></span>Audit log
          </a>
          <a class="nav-link" href="#/compare" data-route="compare">
            <span class="nav-dot"></span>Compare
          </a>
        </nav>

        <div class="sidebar-foot">
          <span class="status-dot"></span>
          <span>Offline sandbox<br /><small>Simulated tools only</small></span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">AgentFence dashboard</p>
            <h1 id="page-title">Overview</h1>
            <p class="subtitle" id="page-subtitle">Before and after enforcement.</p>
          </div>
          <button class="button button-primary" id="run-again" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">Run again</span>
          </button>
        </header>

        <main class="view" id="view" aria-live="polite">
          <div class="loading-panel">
            <div class="spinner spinner-large" aria-hidden="true"></div>
            <p>Loading reports…</p>
          </div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
